<body data-page="product">
<a class="skip-link" href="#inhoud">Naar de inhoud</a>
<div id="site-header"></div>
<main id="inhoud" tabindex="-1">
<section class="section" style="padding-top:3rem"><div class="wrap">
  <div class="crumbs"><a href="index.html">Home</a> / <a href="laminaat.html">Laminaat</a> / <span id="crumb-name"></span></div>
  <div class="product">
    <div class="product-img"><img id="p-img" alt="" width="800" height="800" fetchpriority="high" style="height:auto"></div>
    <div class="product-info">
      <span class="kicker" id="p-lijn"></span>
      <h1 id="p-naam" style="font-size:clamp(2.4rem,4.5vw,3.8rem)"></h1>
      <div class="price" id="p-prijs"></div>
      <p id="p-tekst"></p>
      <dl class="specs" id="p-specs"></dl>
      <div class="calc">
        <h2 style="font-family:var(--sans);font-size:0.74rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;line-height:1.4;margin-bottom:1.2rem">Bereken wat u nodig hebt</h2>
        <div class="row">
          <div class="field"><label for="lengte">Lengte ruimte (m)</label><input id="lengte" inputmode="decimal" placeholder="bijv. 5,2"></div>
          <div class="field"><label for="breedte">Breedte ruimte (m)</label><input id="breedte" inputmode="decimal" placeholder="bijv. 4"></div>
        </div>
        <div class="calc-result"><span>Oppervlakte</span><span id="r-opp"></span></div>
        <div class="calc-result"><span>Benodigd incl. 5% snijverlies</span><span id="r-pakken"></span></div>
        <div class="calc-result"><span>Prijs</span><strong id="r-prijs"></strong></div>
        <button class="btn btn-brass" id="add" type="button">Toevoegen aan bestelling</button>
        <div class="added" id="added">Toegevoegd. <a href="bestellen.html">Bekijk uw bestelling</a> of kies nog een vloer.</div>
        <p class="note">U betaalt niets online. Na uw aanvraag nemen wij contact op om alles te bevestigen.</p>
      </div>
    </div>
  </div>
</div></section>
<section class="section paper"><div class="wrap">
  <div class="section-head"><div><span class="kicker">Ook interessant</span><h2>Vergelijkbare vloeren</h2></div></div>
  <div class="grid" id="related"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="js/data.js?v=2"></script>
<script src="js/app.js?v=2"></script>
